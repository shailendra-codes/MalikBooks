<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MalikBooks - हिंदी, Hinglish और कोडिंग ई-बुक्स</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <nav class="bg-indigo-700 text-white p-4 shadow">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <a href="/" class="text-2xl font-bold">📚 MalikBooks</a>
            <div class="flex items-center space-x-3 text-sm">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="hover:underline">डैशबोर्ड</a>
                    <a href="{% url 'publish_book' %}" class="bg-amber-400 text-black font-bold px-3 py-1.5 rounded">+ किताब डालें</a>
                    <form method="post" action="/accounts/logout/" class="inline">{% csrf_token %}<button class="underline">Logout</button></form>
                {% else %}
                    <a href="/accounts/login/" class="underline">Login</a>
                    <a href="{% url 'signup' %}" class="bg-white text-indigo-700 font-bold px-3 py-1.5 rounded">Signup</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-5xl w-full mx-auto p-4 flex-grow">{% block content %}{% endblock %}</main>
    <footer class="bg-gray-800 text-gray-300 text-center text-xs p-4 mt-8">© 2026 MalikBooks by Shailendra Kumar Singh</footer>
</body>
</html>
